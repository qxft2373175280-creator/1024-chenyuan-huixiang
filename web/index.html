<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d17" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0d17'/%3E%3Crect x='6' y='10' width='20' height='14' fill='%233f7ff2'/%3E%3Crect x='9' y='5' width='14' height='7' fill='%23c7d0dd'/%3E%3Crect x='11' y='8' width='3' height='3' fill='%230b0d17'/%3E%3C/svg%3E"
    />
    <title>地牢卡牌 · aaa1024</title>
    <style>
      /* 首屏 DOM loading：Phaser 启动后由 BootScene 移除 */
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b0d17;
        overflow: hidden;
        font-family: 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
        color: #c7d0dd;
      }
      #game-root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game-root canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #boot-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0b0d17;
        transition: opacity 320ms ease;
        z-index: 10;
      }
      #boot-overlay.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot-overlay .title {
        font-size: 22px;
        letter-spacing: 6px;
        color: #f2f5fa;
      }
      #boot-overlay .bar {
        width: 280px;
        height: 6px;
        border: 1px solid #2e3b52;
        background: #11151f;
      }
      #boot-overlay .bar > i {
        display: block;
        height: 100%;
        width: 8%;
        background: #3f7ff2;
        transition: width 160ms linear;
      }
      #boot-overlay .hint {
        font-size: 12px;
        color: #6f7d95;
      }
      #boot-fatal {
        display: none;
        max-width: 720px;
        padding: 16px 20px;
        border: 1px solid #d94f4f;
        background: #1d2233;
        color: #f2f5fa;
        font-size: 13px;
        line-height: 1.7;
        white-space: pre-wrap;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <div id="boot-overlay">
      <div class="title">地牢卡牌</div>
      <div class="bar"><i></i></div>
      <div class="hint">正在唤醒地牢…</div>
      <pre id="boot-fatal"></pre>
    </div>
    <div id="game-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
